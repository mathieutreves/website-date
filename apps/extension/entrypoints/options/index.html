<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      A tab, not an embedded dialog. Firefox for Android has nowhere to host
      the embedded form, and settings in their own tab are unremarkable
      everywhere else. WXT reads this from the entrypoint rather than from
      wxt.config.ts.
    -->
    <meta name="manifest.open_in_tab" content="true" />
    <title>Page Date settings</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
